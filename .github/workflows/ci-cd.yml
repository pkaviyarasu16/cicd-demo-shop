name: CI/CD

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  test:
    name: run tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

  build:
    name: build image
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:v${{ github.run_number }}
            ghcr.io/${{ github.repository }}:${{ github.sha }}

  deploy:
    name: deploy
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: helm/kind-action@v1
      - name: deploy to Kubernetes
        run: |
          kubectl create secret docker-registry ghcr --docker-server=ghcr.io \
            --docker-username=${{ github.actor }} --docker-password=${{ secrets.GITHUB_TOKEN }}
          sed "s|IMAGE|ghcr.io/${{ github.repository }}:v${{ github.run_number }}|" k8s/shop.yaml | kubectl apply -f -
          kubectl rollout status deployment/shop --timeout=180s
          kubectl get pods -l app=shop
