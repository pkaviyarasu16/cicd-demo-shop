name: CI/CD

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  test:
    name: run tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm test

  build:
    name: build image
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
      - name: build the Docker image
        run: docker build -t ghcr.io/${{ github.repository }}:v${{ github.run_number }} .
      - name: push it to the registry
        run: docker push ghcr.io/${{ github.repository }}:v${{ github.run_number }}

  deploy:
    name: deploy
    needs: build
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - uses: actions/checkout@v5
      - uses: helm/kind-action@v1
      - name: deploy to Kubernetes
        run: |
          kubectl create secret docker-registry ghcr --docker-server=ghcr.io \
            --docker-username=${{ github.actor }} --docker-password=${{ secrets.GITHUB_TOKEN }}
          sed "s|IMAGE|ghcr.io/${{ github.repository }}:v${{ github.run_number }}|" k8s/shop.yaml | kubectl apply -f -
          kubectl rollout status deployment/shop --timeout=180s
          kubectl get pods -l app=shop
